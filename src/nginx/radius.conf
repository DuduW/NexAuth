server {
    listen 80;
    server_name _;
    root /var/www/html;

    # Vite SPA frontend
    location = / { return 301 /admin-spa/; }

    location /admin-spa/ {
        alias /var/www/html/admin-spa/;
        try_files $uri $uri/ /admin-spa/index.html;
    }

    # FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location /docs     { proxy_pass http://127.0.0.1:8000/docs; proxy_set_header Host $host; }
    location /redoc    { proxy_pass http://127.0.0.1:8000/redoc; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; proxy_set_header Host $host; }

    # Legacy PHP: custom admin
    location /admin/ {
        try_files $uri $uri/ /admin/index.php?$args;
    }
    # Legacy PHP: daloRADIUS
    location /daloradius-web/ {
        try_files $uri $uri/ /daloradius-web/index.php?$args;
    }
    # Legacy PHP: manage API
    location /manage/ {
        try_files $uri $uri/ /manage/index.php?$args;
    }

    # PHP processing
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
    }

    # Deny hidden files
    location ~ /\. { deny all; }
}
